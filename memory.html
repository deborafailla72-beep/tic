<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory d'Europa: saluti e bandiere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F6FA; --surface: #FFFFFF; --ink: #1B2A3D; --muted: #55677B; --line: #D1DEEA;
    --back-a: #24459A; --back-b: #1A3375; --accent: #FFCC33; --accent-ink: #3A2A00;
    --audio-bg: #E4EBFA; --ok: #2E9B5B; --focus: #1B2A3D;
    --nord: #3C8FD6; --ovest: #8466D1; --sud: #E2704A; --est: #4FA05B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1624; --surface: #172236; --ink: #EAF0F8; --muted: #9DB0C6; --line: #2A3B55;
      --back-a: #3C62C2; --back-b: #2A4A9E; --audio-bg: #1E2E4D; --focus: #FFCC33;
      --nord: #5EA6E6; --ovest: #A18AE6; --sud: #EC8665; --est: #6DBB78;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1624; --surface: #172236; --ink: #EAF0F8; --muted: #9DB0C6; --line: #2A3B55;
    --back-a: #3C62C2; --back-b: #2A4A9E; --audio-bg: #1E2E4D; --focus: #FFCC33;
    --nord: #5EA6E6; --ovest: #A18AE6; --sud: #EC8665; --est: #6DBB78;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; line-height: 1.45; }
  h1, h2 { font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 600; margin: 0; line-height: 1.15; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  header.top h1 { font-size: 1.45rem; }
  .sound-btn { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .sound-btn[aria-pressed="false"] { opacity: .65; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .lv { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 6px; cursor: pointer; text-align: center; line-height: 1.2; }
  .lv strong { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1rem; }
  .lv span { font-size: .8rem; color: var(--muted); }
  .lv[aria-pressed="true"] { border-color: var(--back-a); background: var(--audio-bg); }
  .howto { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }

  .stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; text-align: center; font-size: .8rem; color: var(--muted); }
  .stat b { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.2rem; color: var(--ink); }
  .msg { min-height: 2.6em; margin: 0 0 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 2px dashed var(--line); font-weight: 700; font-size: .95rem; }
  .msg.good { border-style: solid; border-color: var(--ok); }
  .msg.try { border-style: solid; border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px; }
  .card { position: relative; padding: 0; border: 0; background: none; cursor: pointer; aspect-ratio: 3 / 4; perspective: 700px; -webkit-tap-highlight-color: transparent; }
  .inner { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; overflow: hidden; }
  .face.back { background: linear-gradient(150deg, var(--back-a), var(--back-b)); color: #fff; font-family: "Fredoka", sans-serif; font-size: 1.8rem; border: 3px solid rgba(255,255,255,.35); }
  .face.front { transform: rotateY(180deg); background: var(--surface); border: 3px solid var(--line); }
  .face.front.audio { background: var(--audio-bg); border-color: var(--back-a); }
  .card.matched .face.front { border-color: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent); }
  .flagwrap { width: 78%; }
  .flagwrap svg, .f svg { display: block; width: 100%; height: auto; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.28); }
  .face .cap { font-weight: 800; font-size: .78rem; text-align: center; padding: 0 3px; }
  .face .ono { font-weight: 800; font-size: .78rem; color: var(--back-a); padding: 0 4px; text-align: center; }
  :root[data-theme="dark"] .face .ono { color: var(--accent); }
  .face .spk { font-size: clamp(1.5rem, 7vw, 2.2rem); line-height: 1; }
  .hab-band { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--hc, transparent); }
  .r-nord { --hc: var(--nord); } .r-ovest { --hc: var(--ovest); } .r-sud { --hc: var(--sud); } .r-est { --hc: var(--est); }

  .bars { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; margin-top: 2px; }
  .bars i { width: 4px; height: 5px; background: var(--back-a); border-radius: 2px; }
  :root[data-theme="dark"] .bars i { background: var(--accent); }
  .card.playing .bars i { animation: eq .5s ease-in-out infinite alternate; }
  .card.playing .bars i:nth-child(2) { animation-delay: .12s; }
  .card.playing .bars i:nth-child(3) { animation-delay: .24s; }
  @keyframes eq { to { height: 16px; } }

  .panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
  .panel h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .panel p { margin: 0 0 12px; color: var(--muted); }
  .habs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .hab { border: 3px solid var(--hc); border-radius: 14px; min-height: 96px; padding: 8px; text-align: left; background: color-mix(in srgb, var(--hc) 12%, var(--surface)); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .hab .hname { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1rem; }
  .hab .slot { display: flex; flex-wrap: wrap; gap: 4px; }
  .hab.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; font-weight: 800; }
  .chip .f { width: 34px; }
  .chip[aria-pressed="true"] { border-color: var(--back-a); background: var(--audio-bg); transform: translateY(-2px); }
  .chip.placed { cursor: default; border-color: var(--ok); padding: 3px 8px 3px 5px; gap: 5px; }
  .chip.placed .f { width: 22px; }
  .chip.placed .t { font-size: .78rem; }

  .result { text-align: center; }
  .stars { font-size: 2.2rem; letter-spacing: 6px; margin: 4px 0 8px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn.sec { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } .card.playing .bars i, .hab.shake { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Memory d'Europa</h1>
    <button class="sound-btn" id="soundBtn" aria-pressed="true">🔊 Suono attivo</button>
  </header>

  <div class="levels" id="levels" role="group" aria-label="Scegli il livello"></div>
  <p class="howto" id="howto"></p>

  <div class="stats">
    <div class="stat"><b id="sPairs">0/0</b>coppie</div>
    <div class="stat"><b id="sTries">0</b>tentativi</div>
    <div class="stat"><b id="sTime">0:00</b><span id="sTimeLbl">tempo</span></div>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <section id="board" aria-label="Tavolo di gioco"><div class="grid" id="grid"></div></section>

  <section id="mapStage" class="panel hidden" aria-label="Costruisci la mappa">
    <h2>Costruisci la mappa d'Europa</h2>
    <p>Tocca una bandiera, poi tocca la zona d'Europa in cui si trova il paese.</p>
    <div class="habs" id="habs"></div>
    <div class="chips" id="chips"></div>
  </section>

  <section id="resultStage" class="panel result hidden" aria-label="Risultato">
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars" aria-hidden="true"></div>
    <p id="rText"></p>
    <div class="row">
      <button class="btn" id="againBtn">Rigioca il livello</button>
      <button class="btn sec" id="nextBtn">Livello successivo</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- Dati ----------
  var REG = {
    nord:  { n: "Europa del Nord",       a: "↑ Nord" },
    ovest: { n: "Europa occidentale",    a: "← Ovest" },
    est:   { n: "Europa orientale",      a: "→ Est" },
    sud:   { n: "Europa del Sud",        a: "↓ Sud" }
  };
  // g = saluto scritto, s = testo letto dalla voce, l = lingua. src: data: URI di una registrazione reale (facoltativo).
  var C = {
    it: { n: "Italia",      r: "sud",   g: "Buongiorno!",   s: "Buongiorno",  l: "it-IT", src: "" },
    es: { n: "Spagna",      r: "sud",   g: "¡Buenos días!", s: "Buenos días", l: "es-ES", src: "" },
    gr: { n: "Grecia",      r: "sud",   g: "Kaliméra!",     s: "Καλημέρα",    l: "el-GR", src: "" },
    fr: { n: "Francia",     r: "ovest", g: "Bonjour!",      s: "Bonjour",     l: "fr-FR", src: "" },
    de: { n: "Germania",    r: "ovest", g: "Guten Tag!",    s: "Guten Tag",   l: "de-DE", src: "" },
    nl: { n: "Paesi Bassi", r: "ovest", g: "Goedendag!",    s: "Goedendag",   l: "nl-NL", src: "" },
    se: { n: "Svezia",      r: "nord",  g: "God dag!",      s: "God dag",     l: "sv-SE", src: "" },
    ie: { n: "Irlanda",     r: "nord",  g: "Good morning!", s: "Good morning",l: "en-IE", src: "" },
    pl: { n: "Polonia",     r: "est",   g: "Dzień dobry!",  s: "Dzień dobry", l: "pl-PL", src: "" },
    ro: { n: "Romania",     r: "est",   g: "Bună ziua!",    s: "Bună ziua",   l: "ro-RO", src: "" }
  };

  function v3(a, b, c) { return '<rect width="10" height="20" fill="' + a + '"/><rect x="10" width="10" height="20" fill="' + b + '"/><rect x="20" width="10" height="20" fill="' + c + '"/>'; }
  function h3(a, b, c) { return '<rect width="30" height="6.7" fill="' + a + '"/><rect y="6.65" width="30" height="6.7" fill="' + b + '"/><rect y="13.3" width="30" height="6.7" fill="' + c + '"/>'; }
  function greek() {
    var s = "", i;
    for (i = 0; i < 9; i++) s += '<rect y="' + (i * 2.2222).toFixed(3) + '" width="30" height="2.23" fill="' + (i % 2 ? "#fff" : "#0D5EAF") + '"/>';
    return s + '<rect width="11.12" height="11.12" fill="#0D5EAF"/><rect x="4.45" width="2.22" height="11.12" fill="#fff"/><rect y="4.45" width="11.12" height="2.22" fill="#fff"/>';
  }
  var FLAGS = {
    it: v3("#009246", "#FFFFFF", "#CE2B37"),
    fr: v3("#0055A4", "#FFFFFF", "#EF4135"),
    ro: v3("#002B7F", "#FCD116", "#CE1126"),
    ie: v3("#169B62", "#FFFFFF", "#FF883E"),
    de: h3("#000000", "#DD0000", "#FFCE00"),
    nl: h3("#AE1C28", "#FFFFFF", "#21468B"),
    pl: '<rect width="30" height="10" fill="#FFFFFF"/><rect y="10" width="30" height="10" fill="#DC143C"/>',
    es: '<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>',
    se: '<rect width="30" height="20" fill="#006AA7"/><rect x="9.4" width="3.75" height="20" fill="#FECC02"/><rect y="8.1" width="30" height="3.75" fill="#FECC02"/>',
    gr: greek()
  };
  function flag(id) {
    return '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' + FLAGS[id] + "</svg>";
  }

  var LEVELS = [
    { name: "Livello 1", tag: "Facile", cols: 3, caps: true, ono: true, band: true, time: 0, each: true,
      ids: ["it", "es", "gr", "fr", "de", "nl"],
      how: "6 coppie. Tocca una carta con l'altoparlante per sentire un saluto, poi cerca la bandiera del paese in cui si dice così. Il saluto è anche scritto e le bandiere hanno il nome e una striscia colorata: indica la zona d'Europa." },
    { name: "Livello 2", tag: "Medio", cols: 4, caps: true, ono: false, band: true, time: 0, each: true,
      ids: ["it", "es", "gr", "fr", "de", "nl", "se", "ie"],
      how: "8 coppie. Ora il saluto è solo da ascoltare. Le bandiere hanno ancora il nome e la striscia della zona d'Europa." },
    { name: "Livello 3", tag: "Difficile", cols: 5, caps: false, ono: false, band: false, time: 240, each: false,
      ids: ["it", "es", "gr", "fr", "de", "nl", "se", "ie", "pl", "ro"],
      how: "10 coppie in 4 minuti. Niente nomi, niente strisce colorate: servono ascolto, memoria e ciò che sai sull'Europa." }
  ];
  var PRAISE = ["Ottimo orecchio!", "Coppia trovata!", "Esatto, bravo!", "Bella memoria!", "Ci sei!", "Proprio lei!"];
  var RETRY  = ["Non è questa. Riascolta il saluto e riprova.", "Quasi! Ricorda dove hai visto quella carta.", "Riprova: ascolta bene la lingua."];

  // ---------- Stato ----------
  var $ = function (s) { return document.querySelector(s); };
  var S = { lv: 0, cards: [], first: null, lock: false, matched: 0, tries: 0, secs: 0, timer: null,
            started: false, sound: true, mapErr: 0, sel: null, placed: 0, over: false };

  // ---------- Audio ----------
  var actx = null, voices = [];
  function ctx() {
    if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { actx = new AC(); } catch (e) {} } }
    if (actx && actx.state === "suspended") { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  function tone(freq, start, dur, vol, type) {
    var c = ctx(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function chime()   { if (S.sound) { tone(523, 0, .18, .18); tone(659, .12, .18, .18); tone(784, .24, .3, .18); } }
  function soft()    { if (S.sound) tone(260, 0, .22, .12, "triangle"); }
  function fanfare() { if (S.sound) [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .14, .3, .18); }); }

  function loadVoices() { if ("speechSynthesis" in window) voices = window.speechSynthesis.getVoices() || []; }
  if ("speechSynthesis" in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
  function voiceFor(lang) {
    var L = lang.toLowerCase(), P = L.split("-")[0], exact = null, part = null;
    voices.forEach(function (v) {
      var vl = (v.lang || "").replace("_", "-").toLowerCase();
      if (!exact && vl === L) exact = v;
      if (!part && vl.split("-")[0] === P) part = v;
    });
    return exact || part;
  }
  function speak(c) {
    if (!S.sound) return;
    if (c.src) { try { new Audio(c.src).play(); return; } catch (e) {} }
    if (!("speechSynthesis" in window)) { say("Questo dispositivo non ha la sintesi vocale. Il saluto è: «" + c.s + "»", "try"); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(c.s);
      u.lang = c.l; u.rate = 0.85; u.pitch = 1; u.volume = 1;
      var v = voiceFor(c.l);
      if (v) u.voice = v;
      else if (voices.length) say("Su questo dispositivo manca la voce per questa lingua. Il saluto è: «" + c.s + "»", "try");
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- Utilità ----------
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
  function say(text, kind) { var m = $("#msg"); m.textContent = text; m.className = "msg" + (kind ? " " + kind : ""); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---------- Interfaccia ----------
  function renderLevels() {
    $("#levels").innerHTML = LEVELS.map(function (l, i) {
      return '<button class="lv" data-lv="' + i + '" aria-pressed="' + (i === S.lv) + '"><strong>' + l.name + "</strong><span>" + l.tag + "</span></button>";
    }).join("");
  }
  function updateStats() {
    var L = LEVELS[S.lv];
    $("#sPairs").textContent = S.matched + "/" + L.ids.length;
    $("#sTries").textContent = S.tries;
    if (L.time) { $("#sTimeLbl").textContent = "tempo rimasto"; $("#sTime").textContent = fmt(Math.max(0, L.time - S.secs)); }
    else { $("#sTimeLbl").textContent = "tempo"; $("#sTime").textContent = fmt(S.secs); }
  }
  function cardHTML(k, i) {
    var L = LEVELS[S.lv], c = C[k.id], front;
    if (k.type === "audio") {
      front = '<div class="face front audio"><div class="spk" aria-hidden="true">🔊</div>' +
              '<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>' +
              (L.ono ? '<div class="ono">' + esc(c.g) + "</div>" : "") + "</div>";
    } else {
      front = '<div class="face front"><div class="flagwrap">' + flag(k.id) + "</div>" +
              (L.caps ? '<div class="cap">' + c.n + "</div>" : "") +
              (L.band ? '<div class="hab-band r-' + c.r + '"></div>' : "") + "</div>";
    }
    return '<button class="card" data-i="' + i + '" aria-label="Carta ' + (i + 1) + ', coperta"><div class="inner"><div class="face back" aria-hidden="true">?</div>' + front + "</div></button>";
  }

  function newGame(lv) {
    if (typeof lv === "number") S.lv = lv;
    stopTimer();
    if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    var L = LEVELS[S.lv], deck = [];
    L.ids.forEach(function (id) { deck.push({ id: id, type: "audio" }); deck.push({ id: id, type: "img" }); });
    S.cards = shuffle(deck).map(function (c) { c.flipped = false; c.matched = false; return c; });
    S.first = null; S.lock = false; S.matched = 0; S.tries = 0; S.secs = 0; S.started = false;
    S.mapErr = 0; S.sel = null; S.placed = 0; S.over = false;
    renderLevels();
    $("#howto").textContent = L.how;
    var g = $("#grid");
    g.style.setProperty("--cols", L.cols);
    g.innerHTML = S.cards.map(cardHTML).join("");
    $("#board").classList.remove("hidden");
    $("#mapStage").classList.add("hidden");
    $("#resultStage").classList.add("hidden");
    say("Tocca una carta per iniziare.");
    updateStats();
  }

  function startTimer() {
    var L = LEVELS[S.lv]; stopTimer();
    S.timer = setInterval(function () { S.secs++; updateStats(); if (L.time && S.secs >= L.time) timeUp(); }, 1000);
  }
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function timeUp() {
    stopTimer(); S.lock = true; S.over = true;
    $("#board").classList.add("hidden");
    showResult({ title: "Tempo scaduto", stars: "", text: "Hai trovato " + S.matched + " coppie su " + LEVELS[S.lv].ids.length + ". Riprova: ora sai già dove sono alcune carte.", done: false });
  }

  function flip(i, on) {
    var k = S.cards[i], el = $('.card[data-i="' + i + '"]'); k.flipped = on;
    el.classList.toggle("flipped", on);
    el.setAttribute("aria-label", "Carta " + (i + 1) + (on ? (k.type === "audio" ? ", saluto in una lingua" : ", bandiera: " + C[k.id].n) : ", coperta"));
  }
  function playing(i) { var el = $('.card[data-i="' + i + '"]'); el.classList.add("playing"); setTimeout(function () { el.classList.remove("playing"); }, 1400); }

  function onCard(i) {
    if (S.lock || S.over) return;
    var k = S.cards[i]; if (k.matched) return;
    if (k.flipped) { if (k.type === "audio") { speak(C[k.id]); playing(i); } return; }
    if (!S.started) { S.started = true; startTimer(); }
    ctx(); flip(i, true);
    if (k.type === "audio") { speak(C[k.id]); playing(i); }
    if (S.first === null) { S.first = i; return; }

    var j = S.first, d = S.cards[j]; S.first = null; S.tries++; updateStats();
    var L = LEVELS[S.lv];
    if (d.id === k.id && d.type !== k.type) {
      k.matched = d.matched = true; S.matched++;
      $('.card[data-i="' + i + '"]').classList.add("matched");
      $('.card[data-i="' + j + '"]').classList.add("matched");
      updateStats(); setTimeout(chime, 250);
      say(L.each ? pick(PRAISE) + " " + C[k.id].n + ": «" + C[k.id].g + "»" : "Coppia trovata.", L.each ? "good" : "");
      if (S.matched === L.ids.length) { stopTimer(); setTimeout(showMap, 1100); }
    } else {
      S.lock = true;
      say(d.type === k.type ? "Hai girato due carte dello stesso tipo: servono un saluto e una bandiera." : pick(RETRY), "try");
      setTimeout(soft, 300);
      setTimeout(function () { flip(i, false); flip(j, false); S.lock = false; }, 1400);
    }
  }

  // ---------- Mappa cognitiva ----------
  function showMap() {
    var L = LEVELS[S.lv], regs = [];
    ["nord", "ovest", "est", "sud"].forEach(function (r) { if (L.ids.some(function (id) { return C[id].r === r; })) regs.push(r); });
    var both = regs.indexOf("ovest") >= 0 && regs.indexOf("est") >= 0;
    $("#board").classList.add("hidden");
    $("#mapStage").classList.remove("hidden");
    $("#habs").innerHTML = regs.map(function (r) {
      var span = (both && (r === "ovest" || r === "est")) ? 1 : 2;
      return '<button class="hab r-' + r + '" data-r="' + r + '" style="grid-column: span ' + span + '" aria-label="Zona: ' + REG[r].n + '">' +
             '<span class="hname">' + REG[r].a + " · " + REG[r].n + '</span><span class="slot"></span></button>';
    }).join("");
    $("#chips").innerHTML = shuffle(L.ids).map(function (id) {
      return '<button class="chip" data-id="' + id + '" aria-pressed="false"><span class="f" aria-hidden="true">' + flag(id) + '</span><span class="t">' + C[id].n + "</span></button>";
    }).join("");
    say("Hai trovato tutte le coppie. Ora costruisci la mappa: in che zona d'Europa si trova ogni paese?", "good");
    $("#mapStage").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function onChip(btn) {
    if (btn.classList.contains("placed")) return;
    var cur = $(".chip[aria-pressed='true']");
    if (cur) cur.setAttribute("aria-pressed", "false");
    if (cur === btn) { S.sel = null; return; }
    btn.setAttribute("aria-pressed", "true"); S.sel = btn.getAttribute("data-id");
    speak(C[S.sel]);
  }
  function onHab(box) {
    if (!S.sel) { say("Prima tocca una bandiera, poi la zona d'Europa.", "try"); return; }
    var c = C[S.sel], chip = $('.chip[data-id="' + S.sel + '"]');
    if (c.r === box.getAttribute("data-r")) {
      chip.setAttribute("aria-pressed", "false"); chip.classList.add("placed");
      box.querySelector(".slot").appendChild(chip);
      S.sel = null; S.placed++; chime();
      say(c.n + " si trova in " + REG[c.r].n + ". Giusto!", "good");
      if (S.placed === LEVELS[S.lv].ids.length) setTimeout(finish, 700);
    } else {
      S.mapErr++; soft();
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      say("Guarda la posizione sulla carta geografica: ripensaci e riprova.", "try");
    }
  }

  // ---------- Risultato ----------
  function showResult(o) {
    $("#rTitle").textContent = o.title; $("#rStars").textContent = o.stars; $("#rText").textContent = o.text;
    $("#resultStage").classList.remove("hidden");
    $("#nextBtn").classList.toggle("hidden", !o.done || S.lv >= LEVELS.length - 1);
    $("#resultStage").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function finish() {
    var L = LEVELS[S.lv], n = L.ids.length, errors = (S.tries - n) + S.mapErr, stars;
    if (errors <= n * 0.6) stars = 3; else if (errors <= n * 1.5) stars = 2; else stars = 1;
    var s = ""; for (var i = 0; i < 3; i++) s += i < stars ? "★" : "☆";
    fanfare();
    $("#mapStage").classList.add("hidden");
    showResult({
      title: S.lv === LEVELS.length - 1 ? "Livello completato: sei un esperto d'Europa!" : "Livello completato!",
      stars: s,
      text: "Hai trovato " + n + " coppie in " + S.tries + " tentativi e costruito la mappa d'Europa." + (L.time ? " Tempo: " + fmt(S.secs) + "." : "") +
            (stars === 3 ? " Ottimo lavoro." : " Rigioca per migliorare il tuo risultato."),
      done: true
    });
    say("Complimenti!", "good");
  }

  // ---------- Eventi ----------
  $("#grid").addEventListener("click", function (e) { var b = e.target.closest(".card"); if (b) onCard(+b.getAttribute("data-i")); });
  $("#levels").addEventListener("click", function (e) { var b = e.target.closest(".lv"); if (b) newGame(+b.getAttribute("data-lv")); });
  $("#chips").addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (b) onChip(b); });
  $("#habs").addEventListener("click", function (e) { var b = e.target.closest(".hab"); if (b) onHab(b); });
  $("#againBtn").addEventListener("click", function () { newGame(S.lv); });
  $("#nextBtn").addEventListener("click", function () { newGame(Math.min(S.lv + 1, LEVELS.length - 1)); });
  $("#soundBtn").addEventListener("click", function () {
    S.sound = !S.sound; this.setAttribute("aria-pressed", String(S.sound));
    this.textContent = S.sound ? "🔊 Suono attivo" : "🔇 Suono spento";
    if (!S.sound && "speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  });

  newGame(0);
})();
</script>
</body>
</html>
